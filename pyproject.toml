[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rocket-gnc-monitor-v0a"
version = "0.1.1"
description = "MIT Rocket Team base and away station telemetry, video and antenna monitoring"
requires-python = ">=3.12,<3.15"
dependencies = [
  "PySide6-Essentials>=6.8,<6.12",
  "pyqtgraph>=0.13.7,<0.15",
  "numpy>=2.1,<3",
  "pyserial==3.5",
  "imageio-ffmpeg==0.6.0",
  "mgrs==1.5.4",
  "openlocationcode==1.0.1",
]

[project.scripts]
rocket-gnc-monitor-v0a = "rocket_gnc_monitor.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pyinstaller>=6.15,<7", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/rocket_gnc_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
