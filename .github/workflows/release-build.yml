name: Build release packages

on:
  workflow_dispatch:
  push:
    branches: [release/v1.0.0]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS-arm64
          - os: macos-15-intel
            name: macOS-x86_64
          - os: windows-2022
            name: Windows-x64
          - os: ubuntu-24.04
            name: Linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          java-package: jdk
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Build and verify native package
        run: python scripts/release_ci.py
      - name: Upload verified package
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-package
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-verification
          path: |
            build/release-verification/
            build/package-verification/report.json
            build/package-verification/**/*report.json
            build/package-verification/**/*.log
          retention-days: 14
