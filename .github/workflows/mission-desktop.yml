name: Mission desktop qualification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mission-desktop.yml'
      - 'pyproject.toml'
      - 'requirements-build.txt'
      - 'src/rocket_gnc_monitor/mission*'
      - 'src/rocket_gnc_monitor/mission_contracts/**'
      - 'src/rocket_gnc_monitor/station_workspace.py'
      - 'tests/test_mission*'

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install pinned desktop runtime
        run: python -m pip install -r requirements-build.txt -e .
      - name: Exercise real application connections and native window lifetimes
        run: >-
          python -m pytest -q
          tests/test_mission_application.py tests/test_mission_codec.py
          tests/test_mission_contracts.py tests/test_mission_results.py
          tests/test_mission_station.py tests/test_mission_lifecycle.py
          --basetemp=build/mission-desktop-fixtures
          --junitxml=build/mission-desktop.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-desktop-${{ matrix.os }}
          path: |
            build/mission-desktop.xml
            build/mission-desktop-fixtures/**/probe.log
            build/mission-desktop-fixtures/**/process.log
          retention-days: 14
