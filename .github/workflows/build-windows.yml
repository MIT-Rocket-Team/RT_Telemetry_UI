name: Build and verify Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up x64 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          architecture: x64

      - name: Set up bridge compiler
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64
          java-package: jdk

      - name: Test, build and verify the relocated package
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import struct
          import subprocess
          import sys
          import sysconfig
          import time
          import zipfile

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          evidence = root / "build" / "ci-windows"
          evidence.mkdir(parents=True, exist_ok=True)
          # Exercise the native Windows Qt plugin, including privately loaded fonts.
          os.environ.pop("QT_QPA_PLATFORM", None)
          os.environ.pop("QT_PLUGIN_PATH", None)
          status = {"status": "running", "steps": []}

          def write_json(path, value):
              path.write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")

          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          def run(name, *command):
              print(f"Starting {name}", flush=True)
              started = time.monotonic()
              with (evidence / f"{name}.log").open("wb") as log:
                  process = subprocess.Popen(
                      [str(arg) for arg in command], cwd=root,
                      stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )
                  for line in process.stdout:
                      log.write(line)
                      log.flush()
                      sys.stdout.buffer.write(line)
                      sys.stdout.buffer.flush()
                  code = process.wait()
              status["steps"].append({
                  "name": name, "returncode": code,
                  "seconds": round(time.monotonic() - started, 2),
              })
              write_json(evidence / "status.json", status)
              if code:
                  raise RuntimeError(f"{name} failed with exit code {code}; see {name}.log")

          try:
              if sysconfig.get_platform() != "win-amd64":
                  raise RuntimeError("This build requires native x64 Windows Python")
              source_commit = subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], cwd=root, text=True,
              ).strip()
              if source_commit != os.environ["GITHUB_SHA"]:
                  raise RuntimeError("Checked-out source differs from workflow revision")
              tracked = subprocess.check_output(
                  ["git", "ls-files", "-z"], cwd=root,
              ).decode("utf-8").split("\0")
              source = {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "commit": source_commit,
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "runner_image": os.environ.get("ImageOS"),
                  "runner_image_version": os.environ.get("ImageVersion"),
                  "platform": platform.platform(),
                  "python": sys.version,
                  "python_platform": sysconfig.get_platform(),
                  "files": [
                      {"path": name, "size": (root / name).stat().st_size,
                       "sha256": digest(root / name)}
                      for name in sorted(filter(None, tracked))
                  ],
              }
              write_json(evidence / "source-manifest.json", source)
              run("setup", sys.executable, "scripts/build.py", "setup")
              python = root / ".venv" / "Scripts" / "python.exe"
              run("runtime", python, "scripts/build.py", "runtime")
              run("bridge", python, "scripts/build.py", "bridge", "--download", "v6.2")
              write_json(root / "vendor" / "source-build.json", source)
              run("tests", python, "-m", "pytest", "-q", f"--junitxml={evidence / 'tests.xml'}")
              run("lint", python, "-m", "ruff", "check", "src", "tests", "--select", "F")
              run("package", python, "scripts/build.py", "package", "--platform", "Windows")

              archive = root / "dist" / "RocketGNCMonitor-v0a-Windows-x64.zip"
              checksum = archive.with_name(archive.name + ".sha256")
              package_sha = digest(archive)
              if checksum.read_text().split()[0] != package_sha:
                  raise RuntimeError("Package ZIP does not match its checksum sidecar")
              relocated = Path(os.environ["RUNNER_TEMP"]) / "Rocket Monitor Package Verification"
              if relocated.exists():
                  shutil.rmtree(relocated)
              relocated.mkdir()
              with zipfile.ZipFile(archive) as bundle:
                  for entry in bundle.infolist():
                      if not (relocated / entry.filename).resolve().is_relative_to(relocated.resolve()):
                          raise RuntimeError("Unsafe package archive path")
                  bundle.extractall(relocated)
              package = relocated / "RocketGNCMonitor-v0a"
              executable = package / "RocketGNCMonitor-v0a.exe"
              with executable.open("rb") as stream:
                  if stream.read(2) != b"MZ":
                      raise RuntimeError("Packaged executable has no DOS header")
                  stream.seek(0x3C)
                  stream.seek(struct.unpack("<I", stream.read(4))[0])
                  if stream.read(4) != b"PE\0\0" or struct.unpack("<H", stream.read(2))[0] != 0x8664:
                      raise RuntimeError("Packaged executable is not Windows x64")

              verification = root / "build" / "package-verification"
              run("verify-package", python, "scripts/verify_package.py",
                  "--package", package,
                  "--model", root / "tests" / "fixtures" / "zephy_testlaunch.ork",
                  "--output", verification)
              report = json.loads((verification / "report.json").read_text())
              if report.get("check_count") != 20 or report.get("minimal_path") is not True:
                  raise RuntimeError("Expected all 20 packaged checks with a minimal system PATH")
              write_json(evidence / "verified-package.json", {
                  "source_commit": source_commit,
                  "file": archive.name,
                  "bytes": archive.stat().st_size,
                  "sha256": package_sha,
                  "executable_machine": "AMD64 (0x8664)",
                  "package_checks": report["check_count"],
                  "minimal_path": report["minimal_path"],
                  "relocated_to_path_with_spaces": True,
                  "qt_platform": "native Windows",
                  "hardware_tested": False,
              })
              status["status"] = "passed"
          except Exception as error:
              status["status"] = "failed"
              status["error"] = str(error)
              raise
          finally:
              for name in ("engine.json", "java-runtime.json", "build-manifest.json"):
                  manifest = root / "vendor" / name
                  if manifest.is_file():
                      shutil.copy2(manifest, evidence / name)
              write_json(evidence / "status.json", status)

      - name: Upload verified Windows package
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-x64-package
          path: |
            dist/RocketGNCMonitor-v0a-Windows-x64.zip
            dist/RocketGNCMonitor-v0a-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload verification and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-x64-verification
          path: |
            build/ci-windows/*.json
            build/ci-windows/*.log
            build/ci-windows/*.xml
            build/package-verification/report.json
            build/package-verification/**/*report.json
            build/package-verification/**/*.log
            build/package-verification/station-base/*.png
            build/package-verification/flight-3d/*.png
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
